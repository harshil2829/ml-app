
<!DOCTYPE html>
<html>
<head>
    <title>Weather ML Prediction App</title>
</head>
<body>
    <h2>🌦 Real-World API + ML Weather Predictor</h2>
    
    <form method="POST">
        Enter City Name:<br><br>
        <input type="text" name="city" required><br><br>
        <button type="submit">Predict Next Temperature</button>
    </form>
    
    {% if prediction %}
        <h3>Predicted Next Temperature: {{ prediction }} °C</h3>
    {% endif %}
    
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
</body>
</html>
